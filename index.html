<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Login Your Delicious Bites | Premium Dining Experience</title>
    <link rel="icon" href="img/logo.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Animated Background -->
    <div class="background-container">
      <div class="background-overlay"></div>
      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
      </div>
    </div>

    <!-- Header with Logo -->
    <header class="login-header" data-aos="fade-down">
      <div class="logo-container">
        <img src="img/logo.jpg" alt="Delicious Bites Logo" class="header-logo" />
        <h1 class="brand-title">Delicious Bites</h1>
        <p class="brand-subtitle">Premium Dining Experience</p>
      </div>
    </header>

    <!-- Main Login Container -->
    <div class="login-wrapper">
      <div id="loginpage" data-aos="zoom-in" data-aos-delay="200">
        <div class="form-container">
          <!-- Welcome Section -->
          <div class="welcome-section">
            <div class="welcome-icon">
              <i class="fas fa-utensils"></i>
            </div>
            <h2 class="welcome-title">Welcome Back!</h2>
            <p class="welcome-subtitle">Sign in to access your account</p>
          </div>

          <!-- Login Form -->
          <form class="form" id="loginForm">
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="Enter username" required />
                <label for="username" class="floating-label">Username</label>
              </div>
            </div>

            <div class="input-group">
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Enter password" required />
                <label for="password" class="floating-label">Password</label>
                <button type="button" class="password-toggle" onclick="togglePassword()">
                  <i class="fas fa-eye" id="passwordToggleIcon"></i>
                </button>
              </div>
            </div>

            <!-- Login Options -->
            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" />
                <span class="checkmark"></span>
                Remember me
              </label>
              <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button type="button" onclick="signinbutton()" class="sign-btn" id="loginBtn">
              <span class="btn-text">Sign In</span>
              <i class="fas fa-arrow-right btn-icon"></i>
              <div class="btn-loader" style="display: none">
                <i class="fas fa-spinner fa-spin"></i>
              </div>
            </button>
          </form>

          <!-- Demo Credentials -->
          <div class="demo-credentials" data-aos="fade-up" data-aos-delay="400">
            <h4><i class="fas fa-info-circle"></i> Demo Credentials</h4>
            <div class="credential-items">
              <div class="credential-item" onclick="fillCredentials('admin', 'admin123')">
                <i class="fas fa-user-shield"></i>
                <span><strong>Admin:</strong> admin / admin123</span>
              </div>
              <div class="credential-item" onclick="fillCredentials('manager', 'manager456')">
                <i class="fas fa-user-tie"></i>
                <span><strong>Manager:</strong> manager / manager456</span>
              </div>
              <div class="credential-item" onclick="fillCredentials('cashier', 'cash789')">
                <i class="fas fa-user"></i>
                <span><strong>Cashier:</strong> cashier / cash789</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="login-footer" data-aos="fade-up" data-aos-delay="600">
      <p>&copy; 2025 Delicious Bites. All rights reserved.</p>
      <div class="social-links">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 800,
        easing: "ease-out-back",
        once: true,
      });

      // Password toggle functionality
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("passwordToggleIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove("fa-eye");
          toggleIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove("fa-eye-slash");
          toggleIcon.classList.add("fa-eye");
        }
      }

      // Fill demo credentials
      function fillCredentials(username, password) {
        document.getElementById("username").value = username;
        document.getElementById("password").value = password;

        // Add visual feedback
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        usernameInput.classList.add("filled");
        passwordInput.classList.add("filled");

        // Show notification
        showNotification("Demo credentials filled!", "success");
      }

      // Show notifications
      function showNotification(message, type = "info") {
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;
        notification.innerHTML = `
          <i class="fas fa-check-circle"></i>
          <span>${message}</span>
        `;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.classList.add("show");
        }, 100);

        setTimeout(() => {
          notification.classList.remove("show");
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 2000);
      }

      // Enhanced form validation
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        signinbutton();
      });

      // Input focus effects
      document.querySelectorAll(".input-wrapper input").forEach((input) => {
        input.addEventListener("focus", function () {
          this.parentElement.classList.add("focused");
        });

        input.addEventListener("blur", function () {
          if (!this.value) {
            this.parentElement.classList.remove("focused");
          }
        });

        input.addEventListener("input", function () {
          if (this.value) {
            this.classList.add("filled");
          } else {
            this.classList.remove("filled");
          }
        });
      });
    </script>
  </body>
</html>
